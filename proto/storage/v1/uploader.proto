syntax = "proto3";

package storage.v1;

option go_package = "github.com/IbiliAze/oss/gen/storage/v1;storagev1";

service UploaderService {
  rpc Upload(stream UploadRequest) returns (UploadResponse);
}

message UploadRequest {
  oneof payload {
    UploadHeader header = 1; // first message
    bytes chunk = 2; // then N chunks
  }
}

message UploadHeader {
  // Full key to store the object under, e.g. "photos/2026/cat.png".
  // Server-validated: relative, no "." or ".." segments, no leading slash.
  string key = 1;
  string content_type = 2;
  int64 size_bytes = 3;
}

message UploadResponse {
  string key = 1;
  string object_id = 2;
  string sha256 = 3;
}
