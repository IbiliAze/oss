syntax = "proto3";

package storage.v1;

option go_package = "github.com/IbiliAze/oss/gen/storage/v1;storagev1";

service ReaderService {
  // Metadata only — no object bytes on the wire.
  rpc ReadMetadata(ReadMetadataRequest) returns (ReadMetadataResponse);
  // One object: metadata first, then N chunks.
  rpc ReadFile(ReadFileRequest) returns (stream ReadFileResponse);
  // Several objects, streamed back to back in the order requested.
  rpc ReadFiles(ReadFilesRequest) returns (stream ReadFilesResponse);
}

message ReadMetadataRequest {
  // Full key within the store, e.g. "photos/2026/cat.png".
  string key = 1;
}

message ReadMetadataResponse {
  ObjectMetadata metadata = 1;
}

message ReadFileRequest {
  string key = 1;
}

message ReadFileResponse {
  oneof payload {
    ObjectMetadata metadata = 1; // first message
    bytes chunk = 2; // then N chunks
  }
}

message ReadFilesRequest {
  repeated string keys = 1;
}

message ReadFilesResponse {
  oneof payload {
    ObjectMetadata metadata = 1; // opens each object
    bytes chunk = 2; // then N chunks, until the next metadata
  }
}

message ObjectMetadata {
  // Addressing key the object was written under.
  string key = 1;
  // Server-assigned, stable for the lifetime of this object version.
  string object_id = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  string sha256 = 5;
}
